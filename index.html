<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./src/styles/styles.css" />

    <title>FichaFit</title>
  </head>
  <body>
    <header class="header">
      <section class="hero-section">
        <div class="container">
          <div class="hero-content">
            <div class="hero-brand">
              <img
                src="./src/assets/images/logo-fichaFit.png"
                alt="Logo do FichaFit."
              />
              <h1>Ficha<span>Fit</span></h1>
            </div>
            <div class="hero-description">
              <p class="description">
                Organize seus treinos.
                <br />
                Acompanhe sua evolução.
              </p>
            </div>
            <div class="hero-features">
              <article class="feature">
                <img
                  src="./src/assets/icons/calendar.svg"
                  alt=""
                  aria-hidden="true"
                />
                <p>Treinos organizados</p>
              </article>
              <article class="feature">
                <img
                  src="./src/assets/icons/graphic-progression.svg"
                  alt=""
                  aria-hidden="true"
                />
                <p>Acompanhe sua evolução</p>
              </article>
              <article class="feature">
                <img
                  src="./src/assets/icons/pdf-file.svg"
                  alt=""
                  aria-hidden="true"
                />
                <p>Gere seu PDF</p>
              </article>
              <article class="feature">
                <img
                  src="./src/assets/icons/cloud-up.svg"
                  alt=""
                  aria-hidden="true"
                />
                <p>Seus dados sempre salvos</p>
              </article>
            </div>
          </div>
        </div>
      </section>
    </header>
    <main class="main-content">
      <!--Empty state-->
      <section class="empty-state">
        <div class="empty-state-content">
          <h2>Bem-vindo ao Ficha<span>Fit!</span></h2>
          <p>
            Você ainda não possui nenhum treino cadastrado. <br />
            <br />
            Crie sua primeira ficha e comece a organizar seus treinos.
          </p>
          <button class="btn-create">+ Criar treino</button>
        </div>
      </section>

      <!--Training Form-->
      <section class="training-form">
        <h2 class="training-form-name">Criar novo treino</h2>
        <div class="form-group">
          <form action="#">
            <div class="form-field">
              <label for="training_name">Nome do treino:</label>
              <input type="text" id="training_name" name="training_name" />
            </div>

            <div class="form-field">
              <label for="dia-semana">Dia da semana:</label>
              <select name="dia_da_semana" id="dia-semana">
                <option value="">-- Selecione um dia --</option>
                <option value="segunda">Segunda-feira</option>
                <option value="terca">Terça-feira</option>
                <option value="quarta">Quarta-feira</option>
                <option value="quinta">Quinta-feira</option>
                <option value="sexta">Sexta-feira</option>
                <option value="sabado">Sábado</option>
                <option value="domingo">Domingo</option>
              </select>
            </div>
            <div class="exercise-list">
              <div class="exercise-form">
                <div class="form-field">
                  <label for="exercise-name">Exercício:</label>
                  <input type="text" id="exercise-name" name="exercise-name" />
                </div>
                <div class="form-field">
                  <label for="method">Método:</label>
                  <input type="text" id="method" name="method" />
                </div>
                <div class="form-field">
                  <label for="series">Séries:</label>
                  <input type="text" id="series" name="series" />
                </div>
                <div class="form-field">
                  <label for="load">Carga:</label>
                  <input type="text" id="load" name="load" />
                </div>
                <div class="form-field">
                  <label for="rest">Descanso:</label>
                  <input type="text" id="rest" name="rest" />
                </div>
                <button type="button" class="bt-add-exercise">
                  + Adicionar Exercício
                </button>
              </div>
            </div>
            <button type="submit">Salvar Treino</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
